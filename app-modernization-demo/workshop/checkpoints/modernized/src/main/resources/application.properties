# MODERNIZED configuration.
# Business rates/thresholds are externalized here and bound into PricingProperties
# via @ConfigurationProperties(prefix = "policy.pricing"), replacing the baseline's
# hard-coded Java constants in PolicyService.

server.port=8080
spring.application.name=app-modernization-demo

# Explicit exception handling (GlobalExceptionHandler) now owns error responses,
# so Spring's default error attributes can stay minimal.
server.error.include-message=never
server.error.include-binding-errors=never

policy.pricing.base-rates.life=0.02
policy.pricing.base-rates.health=0.03
policy.pricing.base-rates.auto=0.05
policy.pricing.senior-age-threshold=60
policy.pricing.senior-surcharge-rate=0.15
policy.pricing.minimum-premium=500.0
