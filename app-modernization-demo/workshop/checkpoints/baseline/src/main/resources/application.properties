# BASELINE configuration.
# Business rates/thresholds are NOT here on purpose: the baseline PolicyService
# hard-codes them as Java constants. The modernized checkpoint externalizes
# them under the "policy.pricing.*" prefix (see PricingProperties).

server.port=8080
spring.application.name=app-modernization-demo

# Keep Spring's default error handling minimal/basic to reflect baseline's
# weak, inconsistent error responses (only a few endpoints validate manually).
server.error.include-message=never
server.error.include-binding-errors=never
