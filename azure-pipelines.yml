trigger:
  paths:
    include:
      - azure-pipelines.yml
      - playwright-lab

pr:
  paths:
    include:
      - azure-pipelines.yml
      - playwright-lab

pool:
  vmImage: ubuntu-latest

variables:
  playwrightWorkingDirectory: $(Build.SourcesDirectory)/playwright-lab

steps:
  - checkout: self

  - task: NodeTool@0
    displayName: Use Node.js 20
    inputs:
      versionSpec: 20.x

  - script: npm ci
    displayName: Install dependencies
    workingDirectory: $(playwrightWorkingDirectory)

  - script: npm run typecheck
    displayName: Type-check Playwright tests
    workingDirectory: $(playwrightWorkingDirectory)

  - script: npm run install:browsers
    displayName: Install Chromium and system dependencies
    workingDirectory: $(playwrightWorkingDirectory)

  - script: npm test
    displayName: Run Playwright tests
    workingDirectory: $(playwrightWorkingDirectory)
    env:
      CI: "true"

  - task: PublishTestResults@2
    displayName: Publish Playwright test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: test-results/junit.xml
      searchFolder: $(playwrightWorkingDirectory)
      testRunTitle: Playwright Chromium
      failTaskOnFailedTests: true

  - task: PublishPipelineArtifact@1
    displayName: Publish Playwright HTML report
    condition: succeededOrFailed()
    inputs:
      targetPath: $(playwrightWorkingDirectory)/playwright-report
      artifact: playwright-report
      publishLocation: pipeline

  - task: PublishPipelineArtifact@1
    displayName: Publish Playwright failure artifacts
    condition: failed()
    inputs:
      targetPath: $(playwrightWorkingDirectory)/test-results
      artifact: playwright-test-results
      publishLocation: pipeline
